//指定使用proto3语法
syntax = "proto3";
//指定生成C#代码的命名空间，.NET 构建工具根据这个文件生成 C# 代码时，会把生成的类放到namespace GrpcClient.ConsoleApp;
option csharp_namespace = "GrpcClient.ConsoleApp";
//指定 Protobuf 包名，用于区分不同服务和消息。
package greet;

//定义一个名为 Greeter 的服务，包含一个 SayHello 方法
service Greeter {
  //定义一个方法，该方法接收 HelloRequest 消息并返回 HelloReply 消息。
  rpc SayHello (HelloRequest) returns (HelloReply);
}

//定义请求消息 HelloRequest的类型，包含一个字符串字段 name
message HelloRequest {
//这里的=1表示字段的唯一标识符，Protobuf 使用这个标识符来序列化和反序列化数据。
  string name = 1;
}

//定义响应消息 HelloReply的类型，包含一个字符串字段 message
message HelloReply {
  string message = 1;
}
